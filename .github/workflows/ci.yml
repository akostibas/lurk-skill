name: CI

# lurk reads macOS app stores (Keychain, Slack's LevelDB, Signal's SQLCipher DB)
# and links against Apple's Security framework, so CI has to run on macOS. The
# tests here are the ones that need no local Slack/Signal session — everything
# requiring real data lives in bin/smoke-test.sh, run at release time.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vendor SQLCipher
        run: bin/vendor-sqlcipher.sh
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal/digest internal/slack internal/signal/*.go)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: build
        run: make build

  # Runs the gitleaks binary directly rather than gitleaks-action, which infers
  # a commit range from the push event and so cannot scan a push containing the
  # root commit (`<root>^` doesn't resolve — it fails having scanned nothing).
  # Scanning full history every time is cheap here and can't silently no-op.
  # Version is pinned to match .pre-commit-config.yaml so local and CI agree.
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact
