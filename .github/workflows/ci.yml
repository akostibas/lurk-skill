name: CI

# lurk reads macOS app stores (Keychain, Slack's LevelDB, Signal's SQLCipher DB)
# and links against Apple's Security framework, so CI has to run on macOS. The
# tests here are the ones that need no local Slack/Signal session — everything
# requiring real data lives in bin/smoke-test.sh, run at release time.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vendor SQLCipher
        run: bin/vendor-sqlcipher.sh
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal/digest internal/slack internal/signal/*.go)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: build
        run: make build

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
