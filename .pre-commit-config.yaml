# Pre-commit hooks for lurk.
#
# Setup:  pre-commit install
# Run:    pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks
        description: Detect hardcoded secrets (this repo handles session tokens)

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        description: Check Go formatting
        entry: gofmt -l -w
        language: system
        types: [go]
        exclude: '^internal/signal/sqlite3(ext)?\.(c|h)$'

      - id: go-vet
        name: go vet
        description: Report suspicious Go constructs
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test
        description: Run the Go test suite
        entry: go test ./...
        language: system
        types: [go]
        pass_filenames: false
